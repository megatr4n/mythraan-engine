[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# every third-party and workspace crate version is declared here, once
cap-std = "3.4.6"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
glam = "0.29.3"
mythraan_math = { path = "crates/mythraan_math" }
mythraan_reflect_derive = { path = "crates/mythraan_reflect_derive" }
notify = "=8.0.0"
proc-macro2 = "1.0.107"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
puffin = { version = "0.20.0", default-features = false }
quote = "1.0.47"
rayon = "1.12.0"
ron = "0.12.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_test = "1.0.177"
syn = "3.0.10"
thiserror = "2.0.21"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
trybuild = "1.0.122"
uuid = { version = "1.29.3", default-features = false, features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
opt-level = 0
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
