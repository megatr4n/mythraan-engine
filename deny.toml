[advisories]
version = 2

[licenses]
version = 2
allow = ["Apache-2.0", "MIT"]
exceptions = [
    { crate = "inotify@0.11.5", allow = ["ISC"] },
    { crate = "inotify-sys@0.1.8", allow = ["ISC"] },
    { crate = "notify@8.0.0", allow = ["CC0-1.0"] },
    { crate = "unicode-ident@1.0.27", allow = ["Unicode-3.0"] },
    { crate = "winx@0.36.4", allow = ["Apache-2.0 WITH LLVM-exception"] },
]

[bans]
multiple-versions = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/crossbeam-rs/crossbeam.git"]
