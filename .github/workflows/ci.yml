name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up the pinned Rust toolchain
        run: rustup toolchain install --no-self-update
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace
      - name: Run Clippy
        run: cargo clippy --workspace -- -D warnings
      - name: Run tests
        run: cargo test --workspace
      - name: Check dependencies
        run: |
          cargo install cargo-deny --version 0.22.0 --locked
          cargo deny check

  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: [ecs, conflict_graph, hierarchy, transform_propagation]
    env:
      MIRI_TOOLCHAIN: nightly-2026-11-22
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Miri
        run: |
          rustup toolchain install "$MIRI_TOOLCHAIN" --profile minimal --component miri --component rust-src --no-self-update
          cargo +"$MIRI_TOOLCHAIN" miri setup
      - name: Test ECS with Miri
        if: matrix.suite == 'ecs'
        shell: bash
        run: |
          targets=$(cargo +"$MIRI_TOOLCHAIN" metadata --locked --no-deps --format-version 1 |
            python3 -c '
          import json
          import sys

          package = next(pkg for pkg in json.load(sys.stdin)["packages"] if pkg["name"] == "mythraan_ecs")
          long_suites = {"conflict_graph", "hierarchy", "transform_propagation"}
          for target in package["targets"]:
              if "test" in target["kind"] and target["name"] not in long_suites:
                  print(target["name"])
          ')
          args=(--lib)
          while IFS= read -r target; do
            [[ -z "$target" ]] || args+=(--test "$target")
          done <<< "$targets"
          cargo +"$MIRI_TOOLCHAIN" miri test --locked -p mythraan_ecs --all-features "${args[@]}"
          cargo +"$MIRI_TOOLCHAIN" miri test --locked -p mythraan_ecs --all-features --doc
      - name: Test the long integration suite with Miri
        if: matrix.suite != 'ecs'
        env:
          MIRI_SUITE: ${{ matrix.suite }}
        run: cargo +"$MIRI_TOOLCHAIN" miri test --locked -p mythraan_ecs --all-features --test "$MIRI_SUITE"
      - name: Stress ECS across additional thread schedules
        if: matrix.suite == 'ecs'
        env:
          MIRIFLAGS: -Zmiri-many-seeds=1..4
        run: cargo +"$MIRI_TOOLCHAIN" miri test --locked -p mythraan_ecs --all-features --test scheduler_stress --test command_buffer_stress
